name: Build and check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and contracts
        run: pnpm check

      - name: Build workspace
        run: pnpm build

      - name: Render Kubernetes base
        run: |
          kubectl kustomize deploy/kubernetes/base > /tmp/public-purpose-lab.yaml
          kubectl kustomize deploy/kubernetes/m3/base > /tmp/public-purpose-lab-m3-local.yaml
          kubectl kustomize deploy/kubernetes/m3/overlays/managed-hosted > /tmp/public-purpose-lab-m3-managed.yaml

      - name: Build framework-host container
        run: docker build --file deploy/containers/framework-host.Containerfile --tag ppl-framework-host:test .

      - name: Exercise M1 container restart and idempotency
        run: |
          docker volume create ppl-m1-state
          trap 'docker volume rm ppl-m1-state' EXIT
          docker run --rm --read-only \
            --volume ppl-m1-state:/var/lib/public-purpose-lab \
            --volume "$PWD/contracts/common/examples:/fixtures:ro" \
            --env PPL_ENVIRONMENT_ID=env-local-001 \
            ppl-framework-host:test process \
            --now 2030-08-25T12:01:00Z \
            /fixtures/c-001-m1-conformance-command.json \
            | grep '"status":"accepted"'
          docker run --rm --read-only \
            --volume ppl-m1-state:/var/lib/public-purpose-lab \
            --volume "$PWD/contracts/common/examples:/fixtures:ro" \
            --env PPL_ENVIRONMENT_ID=env-local-001 \
            ppl-framework-host:test process \
            --now 2030-08-25T12:01:00Z \
            /fixtures/c-001-m1-conformance-command.json \
            | grep '"status":"duplicate"'

      - name: Exercise M2 container trust and session reconciliation
        run: |
          docker volume create ppl-m2-state
          trap 'docker volume rm ppl-m2-state' EXIT
          docker run --rm --read-only \
            --volume ppl-m2-state:/var/lib/public-purpose-lab \
            --env PPL_ENVIRONMENT_CLASS=local-scratch \
            --env PPL_INFORMATION_PROFILE=synthetic-only \
            --env PPL_TRUST_PROFILE=local-synthetic \
            ppl-framework-host:test iam-configure-demo \
            --now 2030-08-26T10:00:00Z
          docker run --rm --read-only \
            --volume ppl-m2-state:/var/lib/public-purpose-lab \
            ppl-framework-host:test iam-health \
            | grep '"activeTrustProfile":"local-synthetic"'
          docker run --rm --read-only \
            --volume ppl-m2-state:/var/lib/public-purpose-lab \
            --volume "$PWD/contracts/identity/examples:/fixtures:ro" \
            ppl-framework-host:test iam-issue-grant \
            --now 2030-08-26T10:00:10Z \
            --output /var/lib/public-purpose-lab/grant.json \
            /fixtures/iam-01-grant-request.json
          docker run --rm --read-only \
            --volume ppl-m2-state:/var/lib/public-purpose-lab \
            ppl-framework-host:test iam-establish \
            --now 2030-08-26T10:00:20Z \
            /var/lib/public-purpose-lab/grant.json \
            | grep '"status":"established"'
          docker run --rm --read-only \
            --volume ppl-m2-state:/var/lib/public-purpose-lab \
            ppl-framework-host:test iam-establish \
            --now 2030-08-26T10:00:20Z \
            /var/lib/public-purpose-lab/grant.json \
            | grep '"status":"established"'

      - name: Build web container
        run: docker build --file deploy/containers/web.Containerfile --tag ppl-web:test .

      - name: Build M3.4 runtime container
        run: docker build --file deploy/containers/m3-runtime.Containerfile --tag public-purpose-lab/m3-runtime:development .

      - name: Install pinned NKey environment tool
        run: |
          go install github.com/nats-io/nsc/v2@v2.15.0
          echo "$(go env GOPATH)/bin" >>"${GITHUB_PATH}"

      - name: Exercise M3.4 secure Compose path and restart
        env:
          PPL_M3_ENVIRONMENT_DIRECTORY: ${{ github.workspace }}/.local/m3-compose-ci
        run: |
          set -euo pipefail
          deploy/local/setup-m3-environment.sh "${PPL_M3_ENVIRONMENT_DIRECTORY}" portable
          trap 'docker compose -f deploy/compose/m3-compose.yaml down --volumes' EXIT
          docker compose -f deploy/compose/m3-compose.yaml up --detach
          for port in 18081 18082 18083; do
            for attempt in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/health/ready" >/dev/null; then
                break
              fi
              if [[ "${attempt}" == "60" ]]; then
                docker compose -f deploy/compose/m3-compose.yaml logs
                exit 1
              fi
              sleep 1
            done
          done
          tools/smoke-m3-native.sh
          docker compose -f deploy/compose/m3-compose.yaml restart nats identity-broker scenario-director presentation-gateway
          for port in 18081 18082 18083; do
            for attempt in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:${port}/health/ready" >/dev/null; then
                break
              fi
              if [[ "${attempt}" == "60" ]]; then
                docker compose -f deploy/compose/m3-compose.yaml logs
                exit 1
              fi
              sleep 1
            done
          done
          tools/smoke-m3-native.sh
