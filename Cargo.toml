[workspace]
members = [
  "backend/apps/component-host",
  "backend/apps/framework-host",
  "backend/apps/m3-runtime",
  "backend/components/aut-01",
  "backend/components/ctl-01",
  "backend/components/ctl-02",
  "backend/components/iam-01",
  "backend/components/int-01",
  "backend/crates/contracts",
  "backend/crates/core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
