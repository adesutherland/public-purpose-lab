{{- range .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate-a-{{ .name }}
  labels:
    app.kubernetes.io/name: gate-a-{{ .name }}
    app.kubernetes.io/component: {{ .name }}
    app.kubernetes.io/part-of: public-purpose-lab
    ppl.public-purpose-lab.org/component-id: {{ .id | quote }}
    ppl.public-purpose-lab.org/information-profile: synthetic-only
    ppl.public-purpose-lab.org/maturity: in-development
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gate-a-{{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate-a-{{ .name }}
        app.kubernetes.io/component: {{ .name }}
        app.kubernetes.io/part-of: public-purpose-lab
        ppl.public-purpose-lab.org/component-id: {{ .id | quote }}
        ppl.public-purpose-lab.org/information-profile: synthetic-only
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: component-host
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["ppl-component-host"]
          env:
            - name: PPL_COMPONENT_ID
              value: {{ .id | quote }}
            - name: PPL_INSTANCE_ID
              value: {{ .instanceId | quote }}
            - name: PPL_LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: PPL_ENVIRONMENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.environmentConfigMap }}
                  key: environmentId
            - name: PPL_SOURCE_REVISION
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.buildEvidenceConfigMap }}
                  key: sourceRevision
            - name: PPL_IMAGE_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Values.buildEvidenceConfigMap }}
                  key: imageDigest
            - name: PPL_NATS_URL
              value: {{ $.Values.natsUrl | quote }}
            - name: PPL_NATS_NKEY_SEED_FILE
              value: /run/secrets/ppl/component.seed
            - name: PPL_WORKLOAD_IDENTITY_FILE
              value: /run/secrets/ppl/workload.nkey
            - name: PPL_NATS_ROOT_CERTIFICATE
              value: /run/trust/ppl/ca.crt
            {{- if .operationsSurface }}
            - name: PPL_STATIC_DIRECTORY
              value: /opt/public-purpose-lab/frontend/operations
            {{- end }}
            {{- if .sourceState }}
            - name: PPL_SOURCE_STATE_PATH
              value: /var/lib/public-purpose-lab/source-governance.sqlite
            {{- end }}
            {{- if .processingState }}
            - name: PPL_PROCESSING_STATE_PATH
              value: /var/lib/public-purpose-lab/knowledge-processing.sqlite
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: nkey
              mountPath: /run/secrets/ppl
              readOnly: true
            - name: root-ca
              mountPath: /run/trust/ppl
              readOnly: true
            - name: temporary
              mountPath: /tmp
            {{- if .sourceState }}
            - name: source-state
              mountPath: /var/lib/public-purpose-lab
            {{- end }}
            {{- if .processingState }}
            - name: processing-state
              mountPath: /var/lib/public-purpose-lab
            {{- end }}
      volumes:
        - name: nkey
          secret:
            secretName: {{ .identitySecret }}
            defaultMode: 0440
        - name: root-ca
          secret:
            secretName: {{ $.Values.rootCaSecret }}
            defaultMode: 0444
        - name: temporary
          emptyDir: {}
        {{- if .sourceState }}
        - name: source-state
          persistentVolumeClaim:
            claimName: gate-a-source-governance-state
        {{- end }}
        {{- if .processingState }}
        - name: processing-state
          persistentVolumeClaim:
            claimName: gate-a-knowledge-processing-state
        {{- end }}
{{- if .sourceState }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gate-a-source-governance-state
  labels:
    app.kubernetes.io/name: gate-a-source-governance
    app.kubernetes.io/part-of: public-purpose-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
{{- end }}
{{- if .processingState }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gate-a-knowledge-processing-state
  labels:
    app.kubernetes.io/name: gate-a-knowledge-processing
    app.kubernetes.io/part-of: public-purpose-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
{{- end }}
{{- if .operationsSurface }}
---
apiVersion: v1
kind: Service
metadata:
  name: gate-a-operations
  labels:
    app.kubernetes.io/name: gate-a-operations
    app.kubernetes.io/part-of: public-purpose-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gate-a-operations
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
{{- end }}
