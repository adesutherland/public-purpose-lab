fullnameOverride: nats
config:
  cluster:
    enabled: false
  jetstream:
    enabled: true
    fileStore:
      enabled: true
      pvc:
        enabled: true
        size: 1Gi
      maxSize: "134217728"
    memoryStore:
      enabled: false
  nats:
    tls:
      enabled: true
      secretName: ppl-m3-nats-tls
      dir: /etc/nats-certs/nats
      cert: tls.crt
      key: tls.key
      merge:
        ca_file: /etc/nats-ca-cert/ca.crt
        verify: false
  monitor:
    enabled: false
  merge:
    jetstream:
      max_memory_store: 67108864
tlsCA:
  enabled: true
  secretName: ppl-m3-root-ca
  key: ca.crt
container:
  image:
    repository: nats
    tag: 2.14.5-alpine
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      cpu: 250m
      memory: 192Mi
natsBox:
  enabled: false
podDisruptionBudget:
  enabled: false
