apiVersion: apps/v1
kind: Deployment
metadata:
  name: m3-presentation-gateway
spec:
  template:
    spec:
      serviceAccountName: m3-presentation-gateway
      automountServiceAccountToken: false
      containers:
        - name: runtime
          imagePullPolicy: IfNotPresent
          env:
            - name: PPL_RUNTIME_PROFILE
              value: managed-hosted
            - name: PPL_ALLOWED_ORIGIN
              value: null
              valueFrom:
                configMapKeyRef:
                  name: ppl-m3-managed-environment
                  key: presentationOrigin
            - name: PPL_ENVIRONMENT_ID
              valueFrom:
                configMapKeyRef:
                  name: ppl-m3-managed-environment
                  key: environmentId
            - name: PPL_GOOGLE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ppl-m3-google-oidc-presentation
                  key: clientId
            - name: PPL_GOOGLE_OIDC_CLIENT_SECRET_FILE
              value: /run/secrets/ppl-oidc/client-secret
            - name: PPL_GOOGLE_OIDC_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: ppl-m3-managed-environment
                  key: presentationRedirectUri
            - name: PPL_OIDC_ROLE_MAPPING_PATH
              value: /run/secrets/ppl-oidc/role-mapping.json
            - name: PPL_TRUST_BUNDLE_PATH
              value: /run/trust/ppl-identity/trust-bundle.json
          volumeMounts:
            - name: oidc
              mountPath: /run/secrets/ppl-oidc
              readOnly: true
            - name: identity-public
              mountPath: /run/trust/ppl-identity
              readOnly: true
      volumes:
        - $patch: replace
        - name: state
          persistentVolumeClaim:
            claimName: m3-presentation-state
        - name: oidc
          secret:
            secretName: ppl-m3-google-oidc-presentation
            defaultMode: 0440
        - name: identity-public
          secret:
            secretName: ppl-m3-managed-identity
            items:
              - key: trust-bundle.json
                path: trust-bundle.json
            defaultMode: 0440
        - name: nkey
          secret:
            secretName: ppl-m3-presentation-nkey
            defaultMode: 0440
        - name: root-ca
          secret:
            secretName: ppl-m3-root-ca
            defaultMode: 0444
        - name: temporary
          emptyDir: {}
