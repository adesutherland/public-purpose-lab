name: public-purpose-lab-m3

services:
  state-initializer:
    image: public-purpose-lab/m3-runtime:development
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chmod 700 /state/director /state/presentation /state/identity /state/identity-public
        && chown 65532:65532 /state/director /state/presentation /state/identity /state/identity-public
    network_mode: none
    volumes:
      - director-state:/state/director
      - presentation-state:/state/presentation
      - identity-state:/state/identity
      - identity-public:/state/identity-public
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]

  nats:
    image: nats:2.14.5-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    restart: unless-stopped
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/nats-server.conf:/etc/nats/nats.conf:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/nats/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/nats-server.crt:/etc/nats/nats-server.crt:ro
      - nats-state:/data
    secrets:
      - source: nats-server-key
        target: /etc/nats/nats-server.key
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  scenario-director:
    build:
      context: ../..
      dockerfile: deploy/containers/m3-runtime.Containerfile
    image: public-purpose-lab/m3-runtime:development
    restart: on-failure
    depends_on:
      state-initializer:
        condition: service_completed_successfully
      nats:
        condition: service_started
      identity-broker:
        condition: service_started
    environment:
      PPL_RUNTIME_MODE: scenario-director
      PPL_RUNTIME_PROFILE: local-containers
      PPL_LISTEN_ADDRESS: 0.0.0.0:8080
      PPL_ALLOWED_ORIGIN: http://127.0.0.1:18081
      PPL_STATE_PATH: /var/lib/public-purpose-lab/ctl-01.sqlite
      PPL_SECURITY_STATE_PATH: /var/lib/public-purpose-lab/director-security.sqlite
      PPL_ENVIRONMENT_ID_FILE: /run/environment/environment-id
      PPL_STATIC_DIRECTORY: /opt/public-purpose-lab/frontend/director
      PPL_NATS_URL: tls://nats:4222
      PPL_NATS_NKEY_SEED_FILE: /run/secrets/director-nkey
      PPL_NATS_ROOT_CERTIFICATE: /etc/public-purpose-lab/root-ca.crt
    ports:
      - 127.0.0.1:18081:8080
    volumes:
      - director-state:/var/lib/public-purpose-lab
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
    secrets:
      - source: director-nkey
        target: /run/secrets/director-nkey
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  presentation-gateway:
    image: public-purpose-lab/m3-runtime:development
    restart: on-failure
    depends_on:
      state-initializer:
        condition: service_completed_successfully
      nats:
        condition: service_started
      identity-broker:
        condition: service_started
    environment:
      PPL_RUNTIME_MODE: presentation-gateway
      PPL_RUNTIME_PROFILE: local-containers
      PPL_LISTEN_ADDRESS: 0.0.0.0:8080
      PPL_ALLOWED_ORIGIN: http://127.0.0.1:18082
      PPL_STATE_PATH: /var/lib/public-purpose-lab/ctl-02.sqlite
      PPL_SECURITY_STATE_PATH: /var/lib/public-purpose-lab/presentation-security.sqlite
      PPL_TRUST_BUNDLE_PATH: /run/trust/ppl-identity/trust-bundle.json
      PPL_ENVIRONMENT_ID_FILE: /run/environment/environment-id
      PPL_STATIC_DIRECTORY: /opt/public-purpose-lab/frontend/presentation
      PPL_WORKBENCH_DIRECTORY: /opt/public-purpose-lab/frontend/workbench
      PPL_NATS_URL: tls://nats:4222
      PPL_NATS_NKEY_SEED_FILE: /run/secrets/presentation-nkey
      PPL_NATS_ROOT_CERTIFICATE: /etc/public-purpose-lab/root-ca.crt
    ports:
      - 127.0.0.1:18082:8080
    volumes:
      - presentation-state:/var/lib/public-purpose-lab
      - identity-public:/run/trust/ppl-identity:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
    secrets:
      - source: presentation-nkey
        target: /run/secrets/presentation-nkey
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  identity-broker:
    image: public-purpose-lab/m3-runtime:development
    restart: on-failure
    depends_on:
      state-initializer:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      PPL_RUNTIME_MODE: identity-broker
      PPL_RUNTIME_PROFILE: local-containers
      PPL_LISTEN_ADDRESS: 0.0.0.0:8080
      PPL_ALLOWED_ORIGIN: http://127.0.0.1:18083
      PPL_STATE_PATH: /var/lib/public-purpose-lab/identity-runtime.sqlite
      PPL_IDENTITY_STATE_ROOT: /var/lib/public-purpose-lab/identity
      PPL_TRUST_BUNDLE_PATH: /run/trust/ppl-identity/trust-bundle.json
      PPL_ENVIRONMENT_ID_FILE: /run/environment/environment-id
      PPL_NATS_URL: tls://nats:4222
      PPL_NATS_NKEY_SEED_FILE: /run/secrets/identity-nkey
      PPL_NATS_ROOT_CERTIFICATE: /etc/public-purpose-lab/root-ca.crt
    ports:
      - 127.0.0.1:18083:8080
    volumes:
      - identity-state:/var/lib/public-purpose-lab
      - identity-public:/run/trust/ppl-identity
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
    secrets:
      - source: identity-nkey
        target: /run/secrets/identity-nkey
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

secrets:
  director-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/director.seed
  presentation-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/presentation.seed
  identity-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/identity.seed
  nats-server-key:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/nats-server.key

volumes:
  director-state:
  presentation-state:
  identity-state:
  identity-public:
  nats-state:
