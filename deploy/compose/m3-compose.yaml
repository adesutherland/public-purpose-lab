name: public-purpose-lab-m3

services:
  state-initializer:
    image: public-purpose-lab/m3-runtime:development
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chmod 700 /state/director /state/presentation /state/identity /state/identity-public /state/source-governance
        && chown 65532:65532 /state/director /state/presentation /state/identity /state/identity-public /state/source-governance
    network_mode: none
    volumes:
      - director-state:/state/director
      - presentation-state:/state/presentation
      - identity-state:/state/identity
      - identity-public:/state/identity-public
      - source-governance-state:/state/source-governance
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]

  nats:
    image: nats:2.14.5-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    restart: unless-stopped
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/nats-server.conf:/etc/nats/nats.conf:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/nats/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/nats-server.crt:/etc/nats/nats-server.crt:ro
      - nats-state:/data
    secrets:
      - source: nats-server-key
        target: /etc/nats/nats-server.key
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  scenario-director:
    build:
      context: ../..
      dockerfile: deploy/containers/m3-runtime.Containerfile
    image: public-purpose-lab/m3-runtime:development
    restart: on-failure
    depends_on:
      state-initializer:
        condition: service_completed_successfully
      nats:
        condition: service_started
      identity-broker:
        condition: service_started
    environment:
      PPL_RUNTIME_MODE: scenario-director
      PPL_RUNTIME_PROFILE: local-containers
      PPL_LISTEN_ADDRESS: 0.0.0.0:8080
      PPL_ALLOWED_ORIGIN: http://127.0.0.1:18081
      PPL_ADDITIONAL_ALLOWED_ORIGINS: http://localhost:18081
      PPL_PRESENTATION_SURFACE_URL: http://presentation.localhost:18082/
      PPL_WORKBENCH_SURFACE_URL: http://workbench.localhost:18082/workbench/
      PPL_OPERATIONS_SURFACE_URL: http://127.0.0.1:18084/
      PPL_STATE_PATH: /var/lib/public-purpose-lab/ctl-01.sqlite
      PPL_SECURITY_STATE_PATH: /var/lib/public-purpose-lab/director-security.sqlite
      PPL_ENVIRONMENT_ID_FILE: /run/environment/environment-id
      PPL_STATIC_DIRECTORY: /opt/public-purpose-lab/frontend/director
      PPL_NATS_URL: tls://nats:4222
      PPL_NATS_NKEY_SEED_FILE: /run/secrets/director-nkey
      PPL_NATS_ROOT_CERTIFICATE: /etc/public-purpose-lab/root-ca.crt
      PPL_GATE_A_READINESS: "1"
      PPL_INSTANCE_ID: scenario-director-1
      PPL_WORKLOAD_IDENTITY_FILE: /run/identity/workload.nkey
    ports:
      - 127.0.0.1:18081:8080
    volumes:
      - director-state:/var/lib/public-purpose-lab
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/director.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: director-nkey
        target: /run/secrets/director-nkey
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  presentation-gateway:
    image: public-purpose-lab/m3-runtime:development
    restart: on-failure
    depends_on:
      state-initializer:
        condition: service_completed_successfully
      nats:
        condition: service_started
      identity-broker:
        condition: service_started
    environment:
      PPL_RUNTIME_MODE: presentation-gateway
      PPL_RUNTIME_PROFILE: local-containers
      PPL_LISTEN_ADDRESS: 0.0.0.0:8080
      PPL_ALLOWED_ORIGIN: http://presentation.localhost:18082
      PPL_ADDITIONAL_ALLOWED_ORIGINS: http://workbench.localhost:18082
      PPL_STATE_PATH: /var/lib/public-purpose-lab/ctl-02.sqlite
      PPL_SECURITY_STATE_PATH: /var/lib/public-purpose-lab/presentation-security.sqlite
      PPL_TRUST_BUNDLE_PATH: /run/trust/ppl-identity/trust-bundle.json
      PPL_ENVIRONMENT_ID_FILE: /run/environment/environment-id
      PPL_STATIC_DIRECTORY: /opt/public-purpose-lab/frontend/presentation
      PPL_WORKBENCH_DIRECTORY: /opt/public-purpose-lab/frontend/workbench
      PPL_NATS_URL: tls://nats:4222
      PPL_NATS_NKEY_SEED_FILE: /run/secrets/presentation-nkey
      PPL_NATS_ROOT_CERTIFICATE: /etc/public-purpose-lab/root-ca.crt
      PPL_GATE_A_READINESS: "1"
      PPL_INSTANCE_ID: presentation-gateway-1
      PPL_WORKLOAD_IDENTITY_FILE: /run/identity/workload.nkey
    ports:
      - 127.0.0.1:18082:8080
    volumes:
      - presentation-state:/var/lib/public-purpose-lab
      - identity-public:/run/trust/ppl-identity:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/presentation.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: presentation-nkey
        target: /run/secrets/presentation-nkey
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  identity-broker:
    image: public-purpose-lab/m3-runtime:development
    restart: on-failure
    depends_on:
      state-initializer:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      PPL_RUNTIME_MODE: identity-broker
      PPL_RUNTIME_PROFILE: local-containers
      PPL_LISTEN_ADDRESS: 0.0.0.0:8080
      PPL_ALLOWED_ORIGIN: http://127.0.0.1:18083
      PPL_STATE_PATH: /var/lib/public-purpose-lab/identity-runtime.sqlite
      PPL_IDENTITY_STATE_ROOT: /var/lib/public-purpose-lab/identity
      PPL_TRUST_BUNDLE_PATH: /run/trust/ppl-identity/trust-bundle.json
      PPL_ENVIRONMENT_ID_FILE: /run/environment/environment-id
      PPL_NATS_URL: tls://nats:4222
      PPL_NATS_NKEY_SEED_FILE: /run/secrets/identity-nkey
      PPL_NATS_ROOT_CERTIFICATE: /etc/public-purpose-lab/root-ca.crt
      PPL_GATE_A_READINESS: "1"
      PPL_INSTANCE_ID: identity-broker-1
      PPL_WORKLOAD_IDENTITY_FILE: /run/identity/workload.nkey
    ports:
      - 127.0.0.1:18083:8080
    volumes:
      - identity-state:/var/lib/public-purpose-lab
      - identity-public:/run/trust/ppl-identity
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/identity.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: identity-nkey
        target: /run/secrets/identity-nkey
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  authorisation:
    <<: &component-host
      image: public-purpose-lab/m3-runtime:development
      entrypoint: ["ppl-component-host"]
      restart: on-failure
      depends_on:
        nats:
          condition: service_started
      read_only: true
      tmpfs: [/tmp]
      cap_drop: ["ALL"]
      security_opt: ["no-new-privileges:true"]
    environment: &component-environment
      PPL_LISTEN_ADDRESS: 0.0.0.0:8080
      PPL_NATS_URL: tls://nats:4222
      PPL_NATS_ROOT_CERTIFICATE: /etc/public-purpose-lab/root-ca.crt
      PPL_ENVIRONMENT_ID_FILE: /run/environment/environment-id
      PPL_SOURCE_REVISION: ${PPL_SOURCE_REVISION:-working-tree}
      PPL_IMAGE_DIGEST: ${PPL_IMAGE_DIGEST:-local-compose-build}
      PPL_COMPONENT_ID: AUT-01
      PPL_INSTANCE_ID: authorisation-1
      PPL_NATS_NKEY_SEED_FILE: /run/secrets/component-nkey
      PPL_WORKLOAD_IDENTITY_FILE: /run/identity/workload.nkey
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/authorisation.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: authorisation-nkey
        target: /run/secrets/component-nkey

  engagement:
    <<: *component-host
    environment:
      <<: *component-environment
      PPL_COMPONENT_ID: DOM-01
      PPL_INSTANCE_ID: engagement-1
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/engagement.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: engagement-nkey
        target: /run/secrets/component-nkey

  source-governance:
    <<: *component-host
    depends_on:
      state-initializer:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      <<: *component-environment
      PPL_COMPONENT_ID: CNT-01
      PPL_INSTANCE_ID: source-governance-1
      PPL_SOURCE_STATE_PATH: /var/lib/public-purpose-lab/source-governance.sqlite
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/source-governance.nkey:/run/identity/workload.nkey:ro
      - source-governance-state:/var/lib/public-purpose-lab
    secrets:
      - source: source-governance-nkey
        target: /run/secrets/component-nkey

  knowledge-processing:
    <<: *component-host
    environment:
      <<: *component-environment
      PPL_COMPONENT_ID: KNO-01
      PPL_INSTANCE_ID: knowledge-processing-1
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/knowledge-processing.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: knowledge-processing-nkey
        target: /run/secrets/component-nkey

  review-workflow:
    <<: *component-host
    environment:
      <<: *component-environment
      PPL_COMPONENT_ID: WRK-01
      PPL_INSTANCE_ID: review-workflow-1
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/review-workflow.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: review-workflow-nkey
        target: /run/secrets/component-nkey

  reporting:
    <<: *component-host
    environment:
      <<: *component-environment
      PPL_COMPONENT_ID: RPT-01
      PPL_INSTANCE_ID: reporting-1
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/reporting.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: reporting-nkey
        target: /run/secrets/component-nkey

  audit-evidence:
    <<: *component-host
    environment:
      <<: *component-environment
      PPL_COMPONENT_ID: AUD-01
      PPL_INSTANCE_ID: audit-evidence-1
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/audit-evidence.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: audit-evidence-nkey
        target: /run/secrets/component-nkey

  operations:
    <<: *component-host
    environment:
      <<: *component-environment
      PPL_COMPONENT_ID: OPS-01
      PPL_INSTANCE_ID: operations-1
      PPL_STATIC_DIRECTORY: /opt/public-purpose-lab/frontend/operations
    ports:
      - 127.0.0.1:18084:8080
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/operations.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: operations-nkey
        target: /run/secrets/component-nkey

  event-infrastructure:
    <<: *component-host
    environment:
      <<: *component-environment
      PPL_COMPONENT_ID: INT-01
      PPL_INSTANCE_ID: event-infrastructure-1
    volumes:
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/root-ca.crt:/etc/public-purpose-lab/root-ca.crt:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/environment-id:/run/environment/environment-id:ro
      - ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/event-infrastructure.nkey:/run/identity/workload.nkey:ro
    secrets:
      - source: event-infrastructure-nkey
        target: /run/secrets/component-nkey

secrets:
  director-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/director.seed
  presentation-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/presentation.seed
  identity-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/identity.seed
  nats-server-key:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/nats-server.key
  authorisation-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/authorisation.seed
  engagement-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/engagement.seed
  source-governance-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/source-governance.seed
  knowledge-processing-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/knowledge-processing.seed
  review-workflow-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/review-workflow.seed
  reporting-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/reporting.seed
  audit-evidence-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/audit-evidence.seed
  operations-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/operations.seed
  event-infrastructure-nkey:
    file: ${PPL_M3_ENVIRONMENT_DIRECTORY:-../../.local/m3-compose}/event-infrastructure.seed

volumes:
  director-state:
  presentation-state:
  identity-state:
  identity-public:
  nats-state:
  source-governance-state:
