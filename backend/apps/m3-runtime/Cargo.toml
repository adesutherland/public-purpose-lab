[package]
name = "ppl-m3-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
futures-util = "0.3"
getrandom = "0.4.3"
google-cloud-kms-v1 = "1.14.0"
crc32c = "0.6.8"
ed25519-dalek = { version = "3.0.0", features = ["pem", "pkcs8"] }
openidconnect = "4.0.1"
ppl-contracts = { path = "../../crates/contracts" }
ppl-ctl-01 = { path = "../../components/ctl-01" }
ppl-ctl-02 = { path = "../../components/ctl-02" }
ppl-iam-01 = { path = "../../components/iam-01" }
ppl-int-01 = { path = "../../components/int-01" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pkcs8 = "0.11"
tempfile = "3"

[lints]
workspace = true
