openapi: 3.1.0
info:
  title: Public Purpose Lab M3 runtime adapter
  version: 1.2.1
  description: >-
    In-development, synthetic-only HTTP and SSE adapter for the Scenario
    Director, Identity Broker and Presentation Gateway, including the Gate B
    environment, identity and semantic portal-orchestration path. These paths
    are physical adapters, not semantic contract identifiers or production
    interfaces.
servers:
  - url: http://127.0.0.1:18081
    description: Native Scenario Director
  - url: http://127.0.0.1:18082
    description: Native Presentation Gateway
  - url: http://127.0.0.1:18083
    description: Native Identity Broker health surface
tags:
  - name: assurance
  - name: director
  - name: presentation
  - name: identity
paths:
  /health/live:
    get:
      tags: [assurance]
      operationId: getLiveness
      responses:
        "200":
          description: The process is healthy; this is not interactive or business readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [assurance]
      operationId: getReadiness
      responses:
        "200":
          description: Local interactive dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Interactive readiness is deliberately unavailable or a dependency is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /health/contracts:
    get:
      tags: [assurance]
      operationId: getContractSelfTest
      responses:
        "200":
          description: Image-bundled contract and package or manifest admission result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSelfTest"
  /api/v1/development-session:
    post:
      tags: [assurance]
      operationId: createDevelopmentAssuranceSession
      description: >-
        Establishes a short-lived local test external-human session. The
        adapter is terminally unavailable in hosted profiles and never creates
        a synthetic actor session by itself.
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Application session established in an HttpOnly SameSite=Strict cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentSession"
        "401":
          $ref: "#/components/responses/Refused"
  /api/v1/login-mode:
    get:
      tags: [identity]
      operationId: getLoginMode
      responses:
        "200":
          description: Declares local-test or Google OIDC without disclosing provider configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
  /api/v1/environment:
    get:
      tags: [director]
      operationId: getDemonstrationEnvironment
      description: >-
        Returns the authenticated presenter's environment, trust profile,
        configured surface locations and currently admitted demonstration
        catalogue. A catalogue readiness result is not a business-completion
        or compliance claim.
      security:
        - applicationSession: []
      responses:
        "200":
          description: Authenticated Gate B environment and catalogue snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentSnapshot"
        "401":
          $ref: "#/components/responses/Refused"
  /auth/google/start:
    get:
      tags: [identity]
      operationId: beginGoogleOidc
      responses:
        "307":
          description: Redirect to the configured Google OIDC authorisation endpoint with protected flow state.
        "401":
          $ref: "#/components/responses/Refused"
  /auth/google/callback:
    get:
      tags: [identity]
      operationId: completeGoogleOidc
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "303":
          description: Verified and mapped external identity rotated into a new backend application session.
        "401":
          $ref: "#/components/responses/Refused"
  /api/v1/session-context:
    get:
      tags: [identity]
      operationId: getApplicationSessionContext
      security:
        - applicationSession: []
      responses:
        "200":
          description: Privacy-minimised external and optional synthetic application context; no usable session or grant value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
  /api/v1/logout:
    post:
      tags: [identity]
      operationId: revokeApplicationSession
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Application session revoked and cookies expired.
        "401":
          $ref: "#/components/responses/Refused"
  /api/v1/sessions:
    post:
      tags: [director]
      operationId: createDemonstrationSession
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sessionId:
                  type: [string, "null"]
      responses:
        "200":
          description: D-002 outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
  /api/v1/status/{session_id}:
    get:
      tags: [director]
      operationId: getDemonstrationSessionStatus
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/SurfaceSlot"
      responses:
        "200":
          description: Scenario, presentation registration and presentation-checkpoint status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
  /api/v1/sessions/{session_id}/lifecycle:
    post:
      tags: [director]
      operationId: applyScenarioLifecycle
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleRequest"
      responses:
        "200":
          description: D-002 lifecycle outcome; reset returns the successor session outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
  /api/v1/sessions/{session_id}/logical-time:
    post:
      tags: [director]
      operationId: changeScenarioLogicalTime
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogicalTimeRequest"
      responses:
        "200":
          description: D-003 logical-time outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
  /api/v1/sessions/{session_id}/cue-delay:
    post:
      tags: [director]
      operationId: activatePresentationCueDelay
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, delayMilliseconds]
              properties:
                expectedRevision:
                  type: integer
                  minimum: 0
                delayMilliseconds:
                  type: integer
                  minimum: 50
                  maximum: 3000
      responses:
        "200":
          description: D-003 component-control outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
  /api/v1/sessions/{session_id}/cue:
    post:
      tags: [director]
      operationId: issuePresentationCue
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CueRequest"
      responses:
        "200":
          description: Accepted P-003 presentation cue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
  /api/v1/sessions/{session_id}/synthetic-sign-in:
    post:
      tags: [director, identity]
      operationId: requestSyntheticApplicationSignIn
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorId, surfaceSlot]
              properties:
                actorId:
                  enum: [synthetic-audience-user, synthetic-reviewer]
                surfaceSlot:
                  enum: [audience-display, reviewer-workbench]
      responses:
        "200":
          description: I-004 request accepted for backend-only delivery; establishment remains target-owned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
  /api/v1/registrations:
    post:
      tags: [presentation]
      operationId: registerPresentationSurface
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "200":
          description: Current P-002 registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractValue"
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
  /api/v1/cues:
    get:
      tags: [presentation]
      operationId: streamPresentationCues
      security:
        - applicationSession: []
      responses:
        "200":
          description: SSE stream of P-003 semantic cues; the browser receives no route or broker credential.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Refused"
  /api/v1/outcomes:
    post:
      tags: [presentation]
      operationId: recordPresentationCueOutcome
      security:
        - applicationSession: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../presentation/p-004-presentation-cue-outcome.schema.json
      responses:
        "200":
          description: Conclusive P-004 outcome bound to the issued cue and current registration generation.
          content:
            application/json:
              schema:
                $ref: ../presentation/p-004-presentation-cue-outcome.schema.json
        "401":
          $ref: "#/components/responses/Refused"
        "409":
          $ref: "#/components/responses/Refused"
components:
  securitySchemes:
    applicationSession:
      type: apiKey
      in: cookie
      name: PPL_APP_SESSION
      description: Opaque backend application session; local test or managed OIDC identity is profile-dependent.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
      description: Must exactly match the configured local or port-forwarded origin.
    Csrf:
      name: X-PPL-CSRF
      in: header
      required: true
      schema:
        type: string
      description: Must match the separately stored hash for the current application session.
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    SurfaceSlot:
      name: surfaceSlot
      in: query
      required: false
      schema:
        enum: [audience-display, reviewer-workbench]
  responses:
    Refused:
      description: Request is unauthorised, stale, unsupported or otherwise safely refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refusal"
  schemas:
    ContractValue:
      type: object
      additionalProperties: true
      description: A response validated and emitted as the named repository contract type.
    Liveness:
      type: object
      additionalProperties: false
      required: [softwareStatus, mode, profile, maturity, informationProfile]
      properties:
        softwareStatus: { const: healthy }
        mode: { type: string }
        profile: { type: string }
        maturity: { const: in-development }
        informationProfile: { const: synthetic-only }
    Readiness:
      type: object
      additionalProperties: false
      required:
        [
          softwareStatus,
          interactiveReady,
          trustProfile,
          reasonCode,
          maturity,
          informationProfile,
        ]
      properties:
        softwareStatus: { const: healthy }
        interactiveReady: { type: boolean }
        trustProfile: { type: string }
        reasonCode: { type: [string, "null"] }
        maturity: { const: in-development }
        informationProfile: { const: synthetic-only }
    ContractSelfTest:
      type: object
      additionalProperties: true
      required:
        [
          selfTest,
          contracts,
          sourceRevision,
          imageDigest,
          maturity,
          informationProfile,
        ]
      properties:
        selfTest: { const: passed }
        contracts:
          type: array
          items: { type: string }
        sourceRevision: { type: string }
        imageDigest: { type: string }
        packageSourceRevision: { type: string }
        packageImageDigest: { type: string }
        maturity: { const: in-development }
        informationProfile: { const: synthetic-only }
    DevelopmentSession:
      type: object
      additionalProperties: false
      required:
        [
          status,
          principalId,
          roles,
          identityKind,
          expiresInSeconds,
          maturity,
          informationProfile,
          warning,
        ]
      properties:
        status: { const: established }
        principalId: { type: string }
        roles:
          type: array
          items: { type: string }
        identityKind: { const: external-human-test-adapter }
        expiresInSeconds: { const: 1800 }
        maturity: { const: in-development }
        informationProfile: { const: synthetic-only }
        warning: { type: string }
    EnvironmentSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          environmentId,
          runtimeProfile,
          trustProfile,
          trustDescription,
          eventInfrastructure,
          presentationSurfaceUrl,
          workbenchSurfaceUrl,
          componentReadinessUrl,
          catalogue,
          maturity,
          informationProfile,
        ]
      properties:
        environmentId: { type: string }
        runtimeProfile: { type: string }
        trustProfile: { type: string }
        trustDescription: { type: string }
        eventInfrastructure:
          enum: [ready, unavailable]
        presentationSurfaceUrl:
          type: [string, "null"]
          format: uri
        workbenchSurfaceUrl:
          type: [string, "null"]
          format: uri
        componentReadinessUrl:
          type: [string, "null"]
          format: uri
        catalogue:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                scenarioId,
                title,
                purpose,
                maturity,
                estimatedDuration,
                actors,
                requiredComponents,
                status,
                reasons,
                limitations,
              ]
            properties:
              scenarioId: { type: string }
              title: { type: string }
              purpose: { type: string }
              maturity: { type: string }
              estimatedDuration: { type: string }
              actors:
                type: array
                items: { type: string }
              requiredComponents:
                type: array
                items: { type: string }
              status:
                enum: [ready, degraded, unavailable]
              reasons:
                type: array
                items: { type: string }
              limitations:
                type: array
                items: { type: string }
        maturity: { const: in-development }
        informationProfile: { const: synthetic-only }
    Refusal:
      type: object
      additionalProperties: false
      required: [status, code, maturity, informationProfile]
      properties:
        status: { const: refused }
        code: { type: string }
        maturity: { const: in-development }
        informationProfile: { const: synthetic-only }
    LifecycleRequest:
      type: object
      additionalProperties: false
      required: [action, expectedRevision]
      properties:
        action:
          enum: [prepare, start, pause, resume, complete, stop, reset]
        expectedState:
          type: [string, "null"]
        expectedRevision:
          type: integer
          minimum: 0
        reason:
          type: [string, "null"]
    LogicalTimeRequest:
      type: object
      additionalProperties: false
      required: [operation, expectedRevision]
      properties:
        operation:
          enum: [set, advance]
        expectedRevision:
          type: integer
          minimum: 0
        logicalInstant:
          type: [string, "null"]
          format: date-time
        advanceSeconds:
          type: [integer, "null"]
          minimum: 1
    CueRequest:
      type: object
      additionalProperties: false
      required: [surfaceSlot, semanticView, heading, message]
      properties:
        surfaceSlot: { type: string }
        semanticView: { type: string }
        heading: { type: string, maxLength: 120 }
        message: { type: string, maxLength: 1000 }
        expiresInSeconds:
          type: [integer, "null"]
          minimum: 5
          maximum: 300
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [sessionId, surfaceSlot, surfaceRole]
      properties:
        sessionId: { type: string }
        surfaceSlot: { type: string }
        surfaceRole:
          enum: [audience-display, reviewer-workbench]
